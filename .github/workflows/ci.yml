name: CI

on:
  pull_request:
    branches: [main, arena/**]
  push:
    branches: [main, arena/**]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check dentiva tests

      - name: Mypy (Linux)
        if: runner.os == 'Linux'
        run: |
          mypy dentiva

      - name: Pytest
        env:
          QT_QPA_PLATFORM: minimal
        shell: bash
        run: |
          set -o pipefail
          python -c "import sys; print(sys.version); import PySide6; print('PySide6', PySide6.__version__)"
          pytest -v --cov=dentiva --cov-report=term-missing 2>&1 | tee pytest.log
        continue-on-error: true

      - name: Show pytest tail
        if: always()
        shell: bash
        run: |
          if [ -f pytest.log ]; then
            echo "=== pytest.log tail ==="
            tail -120 pytest.log
          fi

      - name: Fail if pytest failed
        shell: bash
        run: |
          # Look for the pytest summary line like "1 failed, 165 passed" or
          # "FAILED test_foo.py::bar - ..." at the start of a line. Grep for
          # word-boundary matches so we don't false-positive on substrings.
          if grep -qE "^FAILED " pytest.log; then
            echo "Pytest had FAILED lines; failing job."
            exit 1
          fi
          # Pytest summary line ends with "in Xs"; count failures from there.
          if grep -qE " [1-9][0-9]* failed" pytest.log; then
            echo "Pytest summary reported failures."
            exit 1
          fi
          if grep -qE "^=+ ERRORS" pytest.log; then
            echo "Pytest reported ERRORS."
            exit 1
          fi
          echo "Pytest appeared clean."

      - name: Verify DB init
        shell: bash
        run: |
          python -c "from dentiva.db.engine import create_app_engine, init_db; e=create_app_engine(); init_db(e); print('OK', e.url)"

      - name: Verify icon build
        if: runner.os == 'Windows'
        run: |
          python scripts/build_icon.py
