name: CI

on:
  pull_request:
    branches: [main, arena/**]
  push:
    branches: [main, arena/**]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check dentiva tests

      - name: Mypy (Linux)
        if: runner.os == 'Linux'
        run: |
          mypy dentiva

      - name: Pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -c "import sys; print(sys.version); import PySide6; print('PySide6', PySide6.__version__)"
          pytest -v --cov=dentiva --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Show pytest tail
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "=== pytest.log tail ==="
          if (Test-Path pytest.log) {
            Get-Content pytest.log -Tail 200
          } else {
            Write-Host "pytest.log missing"
          }

      - name: Verify DB init
        shell: bash
        run: |
          python -c "from dentiva.db.engine import create_app_engine, init_db; e=create_app_engine(); init_db(e); print('OK', e.url)"

      - name: Verify icon build
        if: runner.os == 'Windows'
        run: |
          python scripts/build_icon.py
