name: CI

on:
  pull_request:
    branches: [main, arena/**]
  push:
    branches: [main, arena/**]

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        shell: bash
        run: ruff check dentiva tests scripts

      - name: Mypy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: mypy dentiva

      - name: Pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          python -c "import sys; print(sys.version); import PySide6; print('PySide6', PySide6.__version__)"
          set +e
          pytest -v -p no:pytest-qt --cov=dentiva --cov-report=term-missing > pytest.log 2>&1
          rc=$?
          set -e
          echo "PYTEST_EXIT_CODE=$rc"
          echo "--- pytest.log tail (250 lines) ---"
          tail -n 250 pytest.log
          echo "--- end of pytest.log tail ---"
          exit $rc

      - name: Verify DB init
        shell: bash
        run: |
          python -c "from dentiva.db.engine import create_app_engine, init_db; e=create_app_engine(); init_db(e); print('OK', e.url)"

      - name: Verify icon build
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build_icon.py
