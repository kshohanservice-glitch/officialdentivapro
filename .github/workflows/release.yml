name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          ruff check dentiva tests
          mypy dentiva
          pytest --cov=dentiva

      - name: Build icon
        run: python scripts/build_icon.py

      - name: Build PyInstaller onedir
        run: |
          pyinstaller scripts/dist_pyinstaller.spec --noconfirm

      - name: Compile NSIS installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer/dentivapro.nsi
          arguments: "/V4"

      - name: Rename installer artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          Move-Item -Force "installer/DentivaPro-Setup.exe" "dist/DentivaPro-Setup-$version.exe"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentivaPro-Setup
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DentivaPro-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
